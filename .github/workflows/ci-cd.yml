name: CI-CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static code analysis
        run: npm run lint

      - name: Run CI tests
        run: npm test

      - name: Build reports
        run: npm run build

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: artifacts/build-report.md

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t invoice-processing-system:staging .

      - name: Trigger staging deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
